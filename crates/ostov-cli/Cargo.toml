[package]
name = "ostov-cli"
description = "Программа командной строки ostov"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "ostov"
path = "src/main.rs"

[features]
# Проверка .py документов в ostov check; без неё — предупреждение о пропуске.
python = ["ostov-py/python"]

[dependencies]
ostov-core = { path = "../ostov-core" }
ostov-meta = { path = "../ostov-meta" }
ostov-model = { path = "../ostov-model" }
ostov-py = { path = "../ostov-py" }
