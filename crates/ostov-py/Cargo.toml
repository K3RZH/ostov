[package]
name = "ostov-py"
description = "Логика конфигурации Ostov на Python: правила проведения и пересчёт перед записью"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Python только по запросу: без фичи крейт собирается там, где Python не установлен.
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "=0.30.1", optional = true }

[[example]]
name = "probe"
required-features = ["python"]
