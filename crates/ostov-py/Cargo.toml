[package]
name = "ostov-py"
description = "Логика конфигурации Ostov на Python: правила проведения и пересчёт перед записью"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Python только по запросу: без фичи крейт собирается там, где Python не установлен.
python = ["dep:pyo3", "dep:ostov-sql"]

[dependencies]
ostov-core = { path = "../ostov-core" }
ostov-model = { path = "../ostov-model" }
ostov-store = { path = "../ostov-store" }
# Параметры ctx.query.
ostov-sql = { path = "../ostov-sql", optional = true }
pyo3 = { version = "=0.30.1", optional = true }

[dev-dependencies]
# Тесты: модель «Склада» из настоящего config/ и золотой тест на движке ядра.
ostov-api = { path = "../ostov-api" }
ostov-meta = { path = "../ostov-meta" }
# ctx.query на PostgreSQL, если задан OSTOV_PG_URL.
ostov-store = { path = "../ostov-store", features = ["postgres"] }

[[example]]
name = "probe"
required-features = ["python"]
