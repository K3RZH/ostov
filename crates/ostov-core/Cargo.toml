[package]
name = "ostov-core"
description = "Ядро Ostov: объекты, транзакции, проведение, регистры"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ostov-api = { path = "../ostov-api" }
ostov-model = { path = "../ostov-model" }
ostov-sec = { path = "../ostov-sec" }
ostov-store = { path = "../ostov-store" }

[dev-dependencies]
ostov-store = { path = "../ostov-store", features = ["postgres"] }
