[package]
name = "ostov-io"
description = "Импорт и экспорт Ostov: Excel (xlsx) и XML через Engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
calamine = "=0.38.0"
ostov-api = { path = "../ostov-api" }
quick-xml = "=0.42.0"
rust_xlsxwriter = "=0.102.0"
# Проверка архива xlsx по оглавлению до чтения (НТ-Б4); те же фичи, что у calamine.
zip = { version = "=9.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Тесты: локальная база «Склада» из config/ как &dyn Engine.
ostov-core = { path = "../ostov-core" }
ostov-meta = { path = "../ostov-meta" }
ostov-model = { path = "../ostov-model" }
