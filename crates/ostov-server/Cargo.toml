[package]
name = "ostov-server"
description = "Сервер режима 2: команды Engine по gRPC поверх TLS, сессии входа, ядро на PostgreSQL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Логика документов из config/documents/*.py; без фичи — встроенные правила.
python = ["ostov-py/python"]

[dependencies]
ostov-api = { path = "../ostov-api" }
ostov-core = { path = "../ostov-core" }
ostov-meta = { path = "../ostov-meta" }
ostov-model = { path = "../ostov-model" }
ostov-proto = { path = "../ostov-proto" }
ostov-py = { path = "../ostov-py" }
ostov-sec = { path = "../ostov-sec" }
ostov-store = { path = "../ostov-store", features = ["postgres", "sqlite"] }
rcgen = "=0.14.10"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tonic = { version = "=0.14.9", features = ["tls-ring"] }

[dev-dependencies]
ostov-store = { path = "../ostov-store", features = ["postgres", "sqlite"] }
