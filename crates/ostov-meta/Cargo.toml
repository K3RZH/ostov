[package]
name = "ostov-meta"
description = "Метаданные Ostov: чтение и строгая проверка файлов конфигурации"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
ostov-model = { path = "../ostov-model" }

[dev-dependencies]
# Только тесты: модель из YAML сверяется с «Складом» ядра и запускается в нём.
ostov-api = { path = "../ostov-api" }
ostov-core = { path = "../ostov-core" }
