name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest переходит на Ubuntu 26, а там другие имена пакетов Slint: пока закреплено.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Slint deps
        if: runner.os == 'Linux'
        # Сломанный сторонний репозиторий в образе не должен ронять update: ставим из того,
        # что есть. Ошибки apt — аннотациями, их видно без логов.
        run: |
          if ! sudo apt-get -o Acquire::Retries=5 update > apt-update.log 2>&1; then
            echo "::warning::apt-get update: $(grep -E '^(E|W):' apt-update.log | head -3 | tr '\n' ' ')"
          fi
          if ! sudo apt-get -o Acquire::Retries=5 install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev > apt-install.log 2>&1; then
            echo "::error::apt-get install: $(grep -E '^E:' apt-install.log | head -3 | tr '\n' ' ')"
            exit 1
          fi
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # ostov-ui вне clippy, пока build.rs Артёма на expect.
      - run: cargo clippy --workspace --all-targets --exclude ostov-ui -- -D warnings
      # Упавшие тесты и текст паники — аннотациями: видно без чтения логов.
      - name: cargo test --workspace
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test --workspace 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # GitHub показывает не больше 10 аннотаций на шаг: только начало первой ошибки.
            grep -E -m1 -A8 "^error(\[E[0-9]+\])?:|^test .* FAILED$|panicked at|didn.t exit|overflowed" test.log |
              while IFS= read -r line; do echo "::error::${line//%/%25}"; done
          fi
          exit "$status"

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ostov
          POSTGRES_PASSWORD: ostov
          POSTGRES_DB: ostov
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ostov"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Пароль только для одноразовой базы в контейнере CI.
      OSTOV_PG_URL: postgres://ostov:ostov@localhost:5432/ostov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --exclude ostov-ui

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test --features python
        shell: bash
        run: |
          export PYTHONHOME="$pythonLocation"
          cargo test -p ostov-py -p ostov-cli --features ostov-py/python

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
