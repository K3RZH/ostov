# cargo deny check: уязвимости, лицензии, дубли и источники зависимостей (НТ-Б2).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Заброшенные пакеты в глубине Slint и tonic нам не заменить; ловим только прямые.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
# Совместимые с MPL-2.0 (ADR-015). Slint берём по Royalty-free, не по GPL.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "LicenseRef-Slint-Royalty-free-2.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
